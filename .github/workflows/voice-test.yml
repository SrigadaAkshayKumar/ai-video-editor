# Temporary: runs tools/voice/tts.py end to end on the d01 voiceover with Qwen's public sample voice. Removed after the test.
name: Voice test
on:
  push:
    branches: [claude/confident-heisenberg-2zdiza]
    paths: [.github/workflows/voice-test.yml]
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -q sox
      - name: Sample reference + test config
        run: |
          mkdir -p inbox/brand
          curl -fsSL -o inbox/brand/my-final-voice.wav https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-TTS-Repo/clone.wav
          jq '.refText = "Okay. Yeah. I resent you. I love you. I respect you. But you know what? You blew it! And thanks to you."' config/voice.json > voice-test.json
      - name: Voice
        run: |
          python -m venv ~/.venv-tts
          ~/.venv-tts/bin/pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          ~/.venv-tts/bin/pip install -q qwen-tts==0.1.1 soundfile
          ~/.venv-tts/bin/python tools/voice/tts.py docs/examples/crack-it-d01/d01_tcs_q2_results_voiceover.txt out/d01-voice.wav --config voice-test.json
          ffprobe -v error -show_entries format=duration:stream=sample_rate,channels,codec_name -of default=nw=1 out/d01-voice.wav
          cat out/d01-voice.tts.json
      - uses: actions/upload-artifact@v4
        with:
          name: voice-test
          path: out/
          retention-days: 1
